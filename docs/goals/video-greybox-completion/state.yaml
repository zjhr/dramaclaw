# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "视频转白模管线收尾与验证"
  slug: video-greybox-completion
  kind: existing_plan
  tranche: "白模收尾（接线+测试+证据报告）已完成并经终审；阶段二四功能（片段重拍/视频延长/角色库/多语言口型）转后续 tranche 占位（T007-T010 blocked）"
  status: done
  oracle:
    signal: "L1/L2 单测命令真实通过 + 端到端白模 mp4 通过 ffprobe 时长/音轨验收 + 目视可辨人体与结构"
    cadence: "after each Worker package and at final audit"
    final_proof: "三个 Worker 切片 receipt + 分层测试命令输出 + ffprobe 验收结果 + 证据报告文件路径"
  intake:
    original_request: "继续完成后续工作，并且自己测试，最后拿到证据报告结果"
    interpreted_outcome: "白模管线剩余接线全部完成并通过分层测试，拿到可复现的证据报告"
    input_shape: existing_plan
    audience: "主人（自用）"
    authority: requested
    proof_type: test
    completion_proof: "L1/L2 单测通过 + 端到端产物 ffprobe 验收 + 证据报告落盘"
    likely_misfire: "代码写完零验证；端点通了前端没入口；音轨丢失或时长不符"
    blind_spots_considered:
      - "测试环境能力未知（已由 T001 实测澄清：python/.venv/world extra/ffmpeg/代理均可用）"
      - "白模纯本地渲染，不依赖 agnes 模型能力边界"
      - "音轨保留依赖 -map 1:a? + -shortest，无声源视频须也能出片"
    existing_plan_facts:
      - "计划文件 /Users/mac/.claude/plans/sprightly-beaming-riddle.md（16 锚点已复核，3 处修正已落盘）"
      - "L1 greybox_render.py / L2 greybox_depth.py / 3a jobs.py runner 为前置会话已写"
      - "queue_kind 必须显式 video；前端直接提交仿 handleAudioSeparate"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_slice: true
    worker_completes_whole_slice: true

agents:
  scout: installed
  worker: installed
  judge: installed

visual_board:
  selected: local
  local:
    status: live
    url: "http://goalbuddy.localhost:41737/video-greybox-completion/"
    command: "node /Users/mac/.claude/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/video-greybox-completion"

