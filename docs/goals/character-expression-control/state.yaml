# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "角色表演控制台端到端接入"
  slug: "character-expression-control"
  kind: existing_plan # specific | open_ended | existing_plan | recovery | audit
  tranche: "完成持续可验证的角色表演控制流程，直到端到端验收通过。"
  status: active # active | blocked | done
  oracle:
    signal: "浏览器演示证明通用 3D 面部预览可响应控制，镜头表演状态可保存并恢复，且生成图像与视频请求都包含对应的表演描述。"
    cadence: "每个 Worker 切片完成后及最终审查时"
    final_proof: "最终审查提供浏览器操作记录、保存/重载证据、图像和视频提交请求证据，并确认既有角色外观和参考图流程保持有效。"
  intake:
    original_request: "把角色表情功能改成参考项目的形式，并确认是否可行。"
    interpreted_outcome: "在 DramaClaw 中加入按镜头和角色配置、可保存恢复并接入图像与视频生成的表演控制台，包含通用 3D 人头预览。"
    input_shape: existing_plan # vague | specific | existing_plan | recovery | audit
    audience: "DramaClaw 创作者"
    authority: requested # requested | approved | inferred | needs_approval | blocked
    proof_type: demo # test | demo | artifact | metric | review | source_backed_answer | decision
    completion_proof: "表演状态跨画布重载保留，并进入图像及视频请求；通用 3D 人头对面部控制有响应，且 UI 明确其不代表最终生成角色。"
    likely_misfire: "只做出相似界面，却未持久化状态或接入生成请求；或把通用人头预览误当成真实角色预览。"
    blind_spots_considered:
      - "角色基础外观表情与镜头表演状态必须分离。"
      - "参考项目的 FaceCap 模型是低精度通用资产，复用前需核实授权。"
      - "提示词无法保证视频模型逐时精确执行微表情。"
      - "多角色视频需要每个镜头内按身份隔离表演轨迹。"
      - "生成请求仍须保留现有身份参考图顺序与数量限制。"
    existing_plan_facts:
      - "保留 identity look expression 与现有表情九宫格流程。"
      - "新增按镜头和身份保存的情绪坐标、细部控制和视频关键帧。"
      - "包含通用 3D 人头实时预览，并明确它不等同最终角色。"
      - "静帧使用当前表演状态；视频把关键帧转换为带时间点的具体表演提示。"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  # installed | bundled_not_installed | missing | unknown
  # missing and bundled_not_installed use PM fallback; unknown requires one exact-role attempt before fallback.
  scout: installed
  worker: installed
  judge: installed

visual_board:
  # none | local | unknown
  selected: local
  local:
    status: live # not_requested | starting | live | generated | blocked
    url: "http://goalbuddy.localhost:41737/character-expression-control/"
    command: "node /Users/mac/.codex/plugins/cache/goalbuddy/goalbuddy/0.4.3/skills/goal-prep/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/character-expression-control"

active_task: T031

tasks:
  - id: T001
    type: scout
    assignee: Scout
    status: done
    reasoning_hint: low # default | low | medium | high | xhigh
    objective: "只读核实角色表演控制台的数据持久化、静帧/视频生成接入、3D 预览资产边界与验收路径，并给出带证据的实施切片。"
    inputs:
      - README.md
      - frontend/package.json
      - frontend/src/features/canvas/domain/canvasNodes.ts
      - frontend/src/features/canvas/nodes/VideoNode.tsx
      - src/novelvideo
      - tests
    constraints:
      - "只读探索，不修改实现文件或 GoalBuddy 控制文件。"
      - "结构搜索优先使用 codebase-memory，并检查引用路径的索引覆盖；覆盖不确定时读精确源码。"
      - "如需重新读取用户给出的 GitHub 项目，使用 agent-reach；不复制未确认授权的源码或模型资产。"
      - "核实角色外观 expression 与镜头表演状态的存储边界、多角色隔离和画布重载路径。"
      - "分别追踪图像和视频请求如何接收提示词与身份参考图，并记录提供方限制。"
      - "盘点可用 3D 引擎、可授权通用人头资产及替代方案；不能把预览模型说成最终角色。"
      - "只盘点验收命令；执行基线仍未知，不在只读勘察中运行完整套件。"
    expected_output:
      - "带文件与行号证据的数据/调用链图，覆盖保存、恢复、图像提交、视频提交和角色参考图。"
      - "推荐的 per-shot/per-identity 表演数据契约与旧画布默认策略。"
      - "3D 渲染栈、资产许可状态和可实施的人头预览方案。"
      - "前端定向 Vitest、构建、必要的后端定向 pytest 命令；明确基线未运行。"
      - "建议的最大安全 Worker 切片及残余风险。"
    receipt:
      result: done
      summary: "只读核实画布节点 JSON 可承载新增表演状态并经现有同步保存/恢复；视频节点已有按镜头身份解析角色参考图的路径，图像节点接收通用 referenceUrls，但未发现共享的 per-shot 表演契约或图像身份选择字段。PlayCanvas 已在依赖中，可复用现有 3D viewer 架构；通用可驱动头模的资产许可与能力尚未核实。完整测试未运行。"
      evidence:
        - path: "frontend/src/features/canvas/domain/canvasNodes.ts:182"
          detail: "VideoNodeData 已有 referenceOrder、identityCalls；节点类型允许额外字段。ImageGenNodeData 有 prompt 与 referenceImageUrl，但无身份绑定表演字段。"
        - path: "frontend/src/features/canvas/nodes/VideoNode.tsx:2147"
          detail: "视频提交先组合上游文本、用户提示词和运镜片段；随后按 identityCalls 获取 identity looks，planIdentityCall 提取角色参考图 URL。"
        - path: "frontend/src/features/canvas/nodes/VideoNode.tsx:2316"
          detail: "首帧/I2V 路径将 identityImageUrls 与上游图片合并后受模型 image cap 限制，并与 composedPrompt 一起提交。"
        - path: "frontend/src/features/canvas/nodes/VideoNode.tsx:2504"
          detail: "Omni 路径优先加入身份图和声线，再收集上游图片/视频/音频；按模型能力上限裁剪参考素材。"
        - path: "frontend/src/features/canvas/nodes/ImageGenNode.tsx:1228"
          detail: "图像路径合成有效提示词，并生成包含 referenceUrls、模型、生成模式和参数的请求 payload；身份专用参考须接入该链路。"
        - path: "frontend/src/features/freezone/useCanvasSync.ts:792"
          detail: "画布同步 hook 使用 React Flow 节点数据；源码中包含 autosave 和跨画布同步逻辑，新增节点数据字段适合随节点保存。"
        - path: "src/novelvideo/freezone/canvas_store.py:743"
          detail: "save_canvas 基于客户端 payload 构建整份画布数据并原子写入 JSON；不会因新增节点数据字段而要求独立后端字段迁移。"
        - path: "src/novelvideo/api/routes/freezone.py:13192"
          detail: "提供画布 GET 路由；保存路由位于该文件 13491 行附近。"
        - path: "src/novelvideo/freezone/video_node.py:413"
          detail: "视频 prompt builder 接收用户 prompt 并追加运镜和身份一致性说明；具体表演描述可作为 prompt 内容传入。"
        - path: "src/novelvideo/api/schemas.py:1190"
          detail: "图生视频 schema 支持 image_urls 和 prompt；Omni schema 支持混合 references，描述称图像、视频、音频上限由模型目录控制。"
        - path: "frontend/package.json:52"
          detail: "前端已有 playcanvas ^2.18.2；项目现有 viewer-kit/three-d 使用 PlayCanvas。未发现 Three.js 依赖。"
        - path: "frontend/src/features/viewer-kit/three-d/engine/viewerApp.ts:3"
          detail: "现有 3D viewer engine 直接导入 PlayCanvas，可作为实现头模预览的渲染栈参考；当前资产用途是场景/导演预览，不证明已有面部驱动。"
      facts:
        - claim: "表演状态可存入对应 VideoNodeData/镜头节点 data 并随画布 nodes 一起保存；无需单独身份全局表演状态。推荐契约为 shotNode.data.performances[identityId] = {schemaVersion, affect:{valence,arousal}, face:{brows,eyes,mouth,jaw}, keyframes:[{tMs,face,affect}]};UI 草稿默认中性空状态。"
          evidence: "frontend/src/features/canvas/domain/canvasNodes.ts:115,src/novelvideo/freezone/canvas_store.py:743"
        - claim: "保留角色 identity look.expression、脸图、三视图和九宫格原有语义。旧画布字段缺失时视为无表演状态，读时归一化为空记录/中性默认；不写回覆盖外观字段。"
          evidence: "frontend/src/features/canvas/nodes/VideoNode.tsx:2172,frontend/src/lib/queries/characters.ts:587"
        - claim: "图像生成需要从所选镜头节点解析身份图、格式化当前表演状态描述并合入 prompt；再将对应身份参考并入现有 referenceUrls，尊重图像模型实际能力和数量限制。"
          evidence: "frontend/src/features/canvas/nodes/ImageGenNode.tsx:1237,frontend/src/features/canvas/nodes/ImageGenNode.tsx:1294"
        - claim: "视频需按 identityCalls 隔离生成每个身份的当前状态和时间顺序关键帧描述；与身份参考图一起送入现有 prompt/reference 路径。文字提示不能保证模型逐时精确执行面部微表情。"
          evidence: "frontend/src/features/canvas/nodes/VideoNode.tsx:2159,src/novelvideo/api/schemas.py:1190"
        - claim: "已确认 PlayCanvas 渲染栈可用，但限定输入范围没有发现通用可驱动头模资产、许可文本或 BlendShape 能力证明；优先自制程序化简化头部或使用明确许可且支持面部 morph targets 的资产。模型必须标注为控制预览，不代表最终角色。"
          evidence: "frontend/package.json:52,frontend/src/features/viewer-kit/three-d/engine/viewerApp.ts:3"
        - claim: "图像参考字段当前是 referenceUrls；视频身份图片先按身份选择顺序解析，随后受选定模型引用能力约束，身份参考可能与其他输入竞争额度。"
          evidence: "frontend/src/features/canvas/domain/canvasNodes.ts:182,frontend/src/features/canvas/nodes/VideoNode.tsx:2316,frontend/src/features/canvas/nodes/VideoNode.tsx:2504"
      contradictions:
        - claim: "目标要求表演状态分别进入图像与视频生成，但现有代码只提供通用 prompt 与参考图载体，没有相同的按镜头、按身份表演状态数据契约；当前 identityCalls 是视频节点字段，图像节点没有相应字段。"
          evidence: "frontend/src/features/canvas/domain/canvasNodes.ts:183,frontend/src/features/canvas/domain/canvasNodes.ts:375"
        - claim: "用户材料提及 FaceCap 通用模型，但本次给定范围内无法证明其许可可复用或存在可用头模文件。"
          evidence: "frontend/package.json:16,frontend/src/features/viewer-kit/three-d/engine/viewerApp.ts:3"
      ambiguity_requiring_judge:
        - question: "Judge 是否采用建议的 per-shot performances[identityId] 契约，并将当前表演状态和 keyframes 都放在镜头节点 data？现有视频身份配置采用 identityCalls 字段。"
        - question: "首个 Worker 是否实施完整的前端表演面板、画布重载、图像/视频 prompt 接入与请求证据，暂缓 3D 预览到专门切片？这是最大但仍可界定的垂直切片；精确 allowlist 需由 Judge 结合函数边界确定。"
        - question: "是否批准以程序化简化头部替代第三方模型资产，或要求先找到并审查有明确许可和面部 morph targets 的模型？"
      commands:
        - command: "cd frontend && pnpm exec vitest run src/__tests__/features/canvas/<新增表演状态测试>.test.tsx src/__tests__/features/freezone/use-canvas-sync.test.tsx"
          purpose: "定向检查控制状态交互、保存与恢复；尖括号需替换为实际新增文件名。"
        - command: "cd frontend && pnpm run build"
          purpose: "TypeScript 与 Vite 构建验证。"
        - command: "uv run pytest tests/test_freezone_canvas_store.py tests/test_freezone_video_route_modes.py"
          purpose: "仅当改动涉及后端画布存储或视频请求/schema 时定向运行。"
        - command: "uv run pytest tests/test_freezone_image_backend.py"
          purpose: "仅当改动涉及图像后端请求适配时定向运行；文件范围可能较大，应优先用 pytest -k 选择具体回归项。"
      note_needed: false
