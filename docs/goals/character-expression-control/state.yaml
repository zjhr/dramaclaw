      - "明确延后项与仍需验证的假设"
    receipt:
      result: done
      decision: approved
      full_outcome_complete: false
      rationale: "批准 T003 实现首个可验证的功能切片：按镜头与身份保存表演状态，提供基础控制，并让静帧和视频请求消费当前状态。将图像节点显式绑定到来源镜头，避免身份状态被推成全局数据。视频时间轴和程序化 3D 预览留作后续顺序切片。当前缺少真实浏览器重载和提交证据，不能判为目标完成。"
      worker_package:
