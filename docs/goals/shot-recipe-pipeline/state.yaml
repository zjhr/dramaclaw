# GoalBuddy v2 state.yaml
# Board truth lives here. goal.md is the editable charter; notes/ holds long receipts only.

version: 2

goal:
  title: "ShotRecipe Production Pipeline"
  slug: "shot-recipe-pipeline"
  kind: specific
  tranche: "Phase 1: 建立镜头配方和版本底座 (ShotRecipe 数据模型 + CharacterLookDecision + 父子版本关系 + 成本/模型快照). Phase 2+: 白模导出、续写、重拍、质量检查按阶段推进。"
  status: active
  oracle:
    signal: "End-to-end demo walkthrough: user creates a shot recipe, binds character look decisions, exports whitebox, runs preflight, renders, reshoots a segment, and verifies all versions retain full lineage (parent_id, prompt_delta, model_snapshot, cost_ledger). Whitebox node has explicit source edge to final render. Quality report returns structured risks, not a single score."
    cadence: "after each Worker package and at final audit"
    final_proof: "e2e demo receipt (video + lineage trace) + quality report sample + source edge verification + state.yaml task receipts"
  intake:
    original_request: "帮我创建goalbuddy"
    interpreted_outcome: "建立可迭代、可溯源的镜头生产配方系统，串起角色妆容表情、白模、续写、重拍和质量检查"
    input_shape: specific
    audience: "主人 / 开发团队"
    authority: requested
    proof_type: artifact
    completion_proof: "从头到尾跑一次 e2e demo：创建镜头 → 选角色/场景/风格 → 调整妆容表情 → 设置节拍 → 导出白模 → 预检 → 生成正式视频 → 质量检查 → 续写/重拍 → 新版本保留完整溯源 → 原版本可恢复"
    likely_misfire: "堆积很多独立功能但无法串起来；把模型不支持的能力伪装成已实现"
    blind_spots_considered:
      - "模型能力边界会降级，必须显示给用户"
      - "不需要设计积分机制"
      - "已有模块（Freezone、CharacterIdentity、Monoform、Director Desk）可以复用"
    existing_plan_facts:
      - "来自对微信文章《Seedance 2.5上线了》的分析"
      - "P0 任务：ShotRecipe + CharacterLookDecision + Preflight"
      - "P1 任务：连续性风险报告、音画事件检查、多版本实验组、预算上限"
      - "P2 任务：参考视频复刻、自动风格提取、多语言口型、复杂物理交互"

rules:
  pm_owns_state: true
  one_active_task: true
  max_write_workers: 1
  no_implementation_without_worker_or_pm_task: true
  no_completion_without_judge_or_pm_audit: true
  planning_is_not_completion: true
  queued_required_worker_blocks_completion: true
  continuous_until_full_outcome: true
  missing_input_or_credentials_do_not_stop_goal: true
  exact_human_approval_can_terminal_wait: true
  preserve_and_validate_existing_plan: true
  intake_misfire_must_be_audited: true
  goal_pressure_requires_oracle: true
  no_completion_on_weak_proof: true
  slice_policy:
    max_consecutive_tiny_tasks: 2
    prefer_vertical_slices: true
    judge_picks_largest_safe_slice: true
    worker_completes_whole_slice: true

agents:
  scout: unknown
  worker: unknown
  judge: unknown

visual_board:
  selected: local
  local:
    status: starting
    url: null
    command: "node <skill-path>/surfaces/local-goal-board/scripts/local-goal-board.mjs --goal docs/goals/shot-recipe-pipeline"

