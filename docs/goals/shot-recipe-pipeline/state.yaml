    inputs:
      - "T001 receipt"
    constraints:
      - "Do not implement."
      - "确保第一块切片是最大安全可逆的垂直切片。"
    expected_output:
      - "Decision: Phase 1 切片定义"
      - "Worker objective 准确描述"
      - "allowed_files"
      - "verify commands"
      - "stop_if"
    receipt: null

  - id: T003
